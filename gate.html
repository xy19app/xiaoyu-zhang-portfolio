<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter — Xiaoyu (Sarah) Zhang</title>
<meta name="robots" content="noindex">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #0A0E16;
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
/* grainient backdrop — runs behind the hyperspeed intro, revealed once it fades */
#grain {
  position: fixed; inset: 0; z-index: 0;
  user-select: none; -webkit-user-select: none;
}
#grain canvas { display: block; width: 100%; height: 100%; }
#bg {
  position: fixed; inset: 0; z-index: 0;
  touch-action: pan-y; user-select: none; -webkit-user-select: none;
  transition: opacity 2.2s cubic-bezier(.2,0,0,1); /* hyperspeed intro fades out at 2s */
}
#bg canvas { display: block; width: 100%; height: 100%; }

/* password card — centered */
.gate {
  position: fixed; inset: 0; z-index: 1;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  pointer-events: none;
}
.gate-card {
  pointer-events: none;
  opacity: 0; transform: translateY(14px);
  transition: opacity .6s cubic-bezier(.2,0,0,1), transform .6s cubic-bezier(.2,0,0,1);
  width: min(440px, 100%);
  background: rgba(10, 14, 22, .72);
  border: 1px solid rgba(255, 255, 255, .1);
  border-radius: 14px;
  padding: 18px 22px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 24px 48px -20px rgba(0, 0, 0, .6);
}
.gate-card.show {
  pointer-events: auto;
  opacity: 1; transform: translateY(0);
}
.gate-card .label {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
  color: #EFA63C;
  margin-bottom: 4px;
}
.gate-card h1 {
  font-family: "Fraunces", Georgia, serif; font-weight: 560;
  font-size: 19px; color: #E9E6DC; line-height: 1.2;
  display: inline;
  margin-right: 12px;
}
.gate-card form {
  margin-top: 12px;
  display: flex; flex-direction: row; align-items: center; gap: 10px;
}
.gate-card input {
  flex: 1; min-width: 0; min-height: 44px;
  background: rgba(255, 255, 255, .05);
  border: 1px solid rgba(255, 255, 255, .14);
  border-radius: 10px;
  padding: 0 14px;
  color: #E9E6DC; font-size: 14px;
  text-align: left;
  outline: none;
  transition: border-color .18s cubic-bezier(.2,0,0,1), background-color .18s cubic-bezier(.2,0,0,1);
}
.gate-card input:focus { border-color: #EFA63C; background: rgba(255, 255, 255, .07); }
.gate-card input::placeholder { color: #677086; }
.gate-card button {
  min-height: 44px; padding: 0 24px;
  border: 0; border-radius: 10px;
  background: #EFA63C; color: #0A0E16;
  font-size: 14px; font-weight: 600; font-family: inherit;
  cursor: pointer;
  transition: background-color .18s cubic-bezier(.2,0,0,1), scale .18s cubic-bezier(.2,0,0,1);
}
.gate-card button:hover { background: #F5B85C; }
.gate-card button:active { scale: .96; }
.gate-error {
  margin-top: 10px; min-height: 16px;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 12px; color: #E66767;
  opacity: 0; transition: opacity .18s cubic-bezier(.2,0,0,1);
}
.gate-error.show { opacity: 1; }
@media (max-width: 560px) {
  .gate-card form { flex-direction: column; align-items: stretch; }
  .gate-card h1 { display: block; margin: 0; }
}
.gate-card.shake { animation: shake .4s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake {
  10%, 90% { transform: translateX(-2px); }
  20%, 80% { transform: translateX(4px); }
  30%, 50%, 70% { transform: translateX(-6px); }
  40%, 60% { transform: translateX(6px); }
}
/* tree artwork — appears with the password card */
.gate-scene { position: relative; width: min(440px, 100%); }
.tree-art {
  --tree-h: min(36vh, 380px);
  position: absolute;
  left: 50%; bottom: calc(100% + 2px);
  width: calc(var(--tree-h) * 420 / 760);
  height: var(--tree-h);
  opacity: 0;
  transform: translate(-50%, -10px) scale(.98);
  transform-origin: 50% 100%;
  transition: opacity 1.1s cubic-bezier(.2,0,0,1), transform 1.4s cubic-bezier(.2,0,0,1);
  pointer-events: none;
  z-index: 1;
}
.tree-art svg { display: block; width: 100%; height: 100%; }
.gate.show .tree-art { opacity: 1; transform: translate(-50%, 0) scale(1); }
.gate.show .tree-art svg { animation: treeSway 12s ease-in-out 1.6s infinite alternate; transform-origin: 50% 100%; }
@keyframes treeSway {
  from { transform: rotate(-.4deg); }
  to { transform: rotate(.4deg); }
}
.gate-card { position: relative; z-index: 2; }
@media (max-width: 560px) {
  .tree-art { --tree-h: min(32vh, 300px); }
}
@media (max-height: 520px) {
  .tree-art { --tree-h: min(30vh, 200px); }
}
@media (prefers-reduced-motion: reduce) {
  .gate-card.shake { animation: none; }
  .gate-card { opacity: 1; transform: none; pointer-events: auto; transition: none; }
  #bg { transition: none; }
  .tree-art { opacity: 1; transform: translate(-50%, 0); transition: none; }
  .gate.show .tree-art svg { animation: none; }
}
</style>
</head>

<script>
(function () {
  "use strict";

  /* ================= PASSWORD =================
     CHANGE THIS before deploying.
     Note: a client-side gate on a static site can be read from the
     source by a determined visitor — it keeps out casual viewers,
     not attackers. Real protection needs a server. */
  var PASSWORD = "1001";

  var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ================= GATE LOGIC ================= */
  var form = document.getElementById("gateForm");
  var input = document.getElementById("pw");
  var error = document.getElementById("gateError");
  var card = document.getElementById("gateCard");
  var gate = document.querySelector(".gate");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (input.value === PASSWORD) {
      try { sessionStorage.setItem("xz-gate", "open"); } catch (err) { /* private mode */ }
      window.location.replace("index.html");
    } else {
      error.classList.add("show");
      card.classList.remove("shake");
      void card.offsetWidth; /* restart the shake animation */
      card.classList.add("shake");
      input.select();
    }
  });
  /* after 2s: the hyperspeed intro fades out, revealing the grainient
     backdrop that has been running behind it, and the card appears */
  var showGate = function () {
    document.getElementById("bg").style.opacity = "0";
    gate.classList.add("show");
    card.classList.add("show");
    input.focus();
    /* once the fade finishes, stop rendering the now-invisible hyperspeed
       so only the grainient keeps drawing (identical visuals, half the GPU) */
    if (reduceMotion) document.getElementById("bg").style.display = "none";
    else setTimeout(function () { document.getElementById("bg").style.display = "none"; }, 2500);
  };
  if (reduceMotion) showGate();
  else setTimeout(showGate, 2000);

  /* ================= HYPERSPEED =================
     Ported from react-bits (MIT, DavidHDev) Hyperspeed.jsx
     to vanilla JS. three.js r147 UMD, loaded locally. */

  var TRAVEL = 400;
  var MAX_CARS = 160;
  var MAX_POLES = 80;
  var MAX_DUST = 1500;
  var MAX_COLORS = 8;
  var CURVES = ['straight', 'gentle', 'winding', 'hills', 'racing', 'deep'];

  var THEMES = {
    dark: {
      background: 'transparent',
      road: '#08080a',
      lines: '#2A2418',
      tail: ['#EFA63C', '#C99B3F', '#8A6420'],
      head: ['#FFE9C4', '#F5D78A', '#C99B3F'],
      poles: ['#C99B3F'],
      dust: '#FFE9C4'
    }
  };

  var BEND = /* glsl */ `
  uniform float uTime;
  uniform float uCurvature;
  uniform vec4 uCurveA;
  uniform float uCurveB;
  uniform float uFogNear;
  uniform float uFogFar;
  uniform float uPixel;
  #define PI 3.14159265358979
  float nsin(float v) { return sin(v) * 0.5 + 0.5; }
  vec3 gentle(float p) {
    return vec3(
      cos(p * PI * 5.0 + uTime) * 25.0 - cos(0.02 * PI * 5.0 + uTime) * 25.0,
      sin(p * PI * 2.0 + PI * 0.5 + uTime) * 15.0 - sin(0.02 * PI * 2.0 + PI * 0.5 + uTime) * 15.0,
      0.0
    );
  }
  float windX(float p) { return cos(PI * p * 4.0 + uTime) * 25.0 + pow(cos(PI * p * 8.0 + uTime * 2.0), 2.0) * 5.0; }
  float windY(float p) { return -nsin(PI * p * 8.0 + uTime) * 10.0 - pow(nsin(PI * p + uTime / 8.0), 5.0) * 10.0; }
  vec3 winding(float p) { return vec3(windX(p) - windX(0.0125), windY(p) - windY(0.0125), 0.0); }
  vec3 hills(float p) {
    return vec3(
      cos(p * PI * 3.0 + uTime) * 30.0 - cos(0.02 * PI * 3.0 + uTime) * 30.0,
      nsin(p * PI * 6.0 + uTime) * 30.0 - nsin(0.02 * PI * 6.0 + uTime) * 30.0,
      nsin(p * PI * 10.0 + uTime) * 20.0 - nsin(0.02 * PI * 10.0 + uTime) * 20.0
    );
  }
  vec3 racing(float p) {
    return vec3(
      sin(p * PI * 2.0 + uTime) * 35.0 - sin(0.0125 * PI * 2.0 + uTime) * 35.0,
      sin(p * PI * 3.0 + uTime) * 10.0 - sin(0.0125 * PI * 3.0 + uTime) * 10.0,
      0.0
    );
  }
  float deepX(float p) { return sin(p * PI * 4.0 + uTime) * 10.0; }
  float deepY(float p) { return pow(abs(p * 10.0), 2.0) + sin(p * PI * 8.0 + uTime) * 20.0; }
  vec3 deep(float p) { return vec3(deepX(p) - deepX(0.02), deepY(p) - deepY(0.02), 0.0); }
  vec3 bend(float p) {
    vec3 d = gentle(p) * uCurveA.x + winding(p) * uCurveA.y + hills(p) * uCurveA.z + racing(p) * uCurveA.w + deep(p) * uCurveB;
    return d * uCurvature;
  }
`;

  var STREAK_VERTEX = /* glsl */ `
  ${BEND}
  attribute vec4 aSeedA;
  attribute vec4 aSeedB;
  attribute float aPair;
  attribute float aTone;
  uniform float uTravel;
  uniform float uRoadX;
  uniform float uRoadWidth;
  uniform float uLanes;
  uniform float uDirection;
  uniform vec2 uSpeedRange;
  uniform float uTrail;
  uniform float uStretch;
  uniform float uSize;
  uniform float uRadiusScale;
  uniform float uMirror;
  uniform vec3 uColors[${MAX_COLORS}];
  uniform float uColorCount;
  varying vec2 vUv;
  varying vec3 vNormal;
  varying vec3 vView;
  varying vec3 vColor;
  varying float vFog;
  varying float vAbove;
  varying float vThin;
  void main() {
    float laneWidth = uRoadWidth / uLanes;
    float lane = min(floor(aSeedA.x * uLanes), uLanes - 1.0);
    float laneX = (lane + 0.5) * laneWidth - uRoadWidth * 0.5 + (aSeedA.y - 0.5) * 0.5 * laneWidth;
    float carWidth = mix(0.3, 0.5, aSeedA.z) * laneWidth;
    float radius = mix(0.05, 0.14, aSeedA.w) * uSize;
    float len = mix(0.03, 0.2, aSeedB.x) * uTravel * uTrail * (1.0 + uStretch);
    float speed = mix(uSpeedRange.x, uSpeedRange.y, aSeedB.y) * uDirection;

    var link = function (gl, fragmentSource) {
      var vertex = compile(gl, gl.VERTEX_SHADER, GRAINIENT_VERTEX);
      var fragment = compile(gl, gl.FRAGMENT_SHADER, fragmentSource);
      var program = gl.createProgram();
      if (!vertex || !fragment || !program) return null;
      gl.attachShader(program, vertex);
      gl.attachShader(program, fragment);
      gl.linkProgram(program);
      gl.deleteShader(vertex);
      gl.deleteShader(fragment);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        gl.deleteProgram(program);
        return null;
      }
      var uniforms = {};
      var count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
      for (var i = 0; i < count; i++) {
        var info = gl.getActiveUniform(program, i);
        if (!info) continue;
        var name = info.name.replace(/\[0\]$/, '');
        uniforms[name] = gl.getUniformLocation(program, name);
      }
      return { program: program, uniforms: uniforms };
    };

    var palette = (Array.isArray(options.colors) && options.colors.length ? options.colors : DEFAULT_COLORS).slice(0, MAX_COLORS);
    var settings = {
      colors: palette.length > 1 ? palette : [palette[0], palette[0]],
      type: TYPES[options.type] !== undefined ? TYPES[options.type] : 0,
      angle: opt('angle', 55),
      bands: clamp(opt('bands', 1), 1, 8),
      speed: Math.max(0, opt('speed', 1)),
      flow: clamp(opt('flow', 0.8), 0, 3),
      scale: clamp(opt('scale', 1), 0.25, 3),
      softness: clamp(opt('softness', 1), 0, 1),
      silk: clamp(opt('silk', 0.35), 0, 1),
      grainAmount: clamp(opt('grainAmount', 0.08), 0, 0.5),
      grainSize: clamp(opt('grainSize', 1.2), 0.5, 4),
      grainAnimated: opt('grainAnimated', true),
      contrast: clamp(opt('contrast', 1), 0.2, 2),
      saturation: clamp(opt('saturation', 1), 0, 2),
      variation: Math.max(0, opt('variation', 0)),
      interactive: opt('interactive', true),
      stir: clamp(opt('stir', 1), 0, 2),
      clickSwirl: opt('clickSwirl', true),
      intro: opt('intro', true),
      lightMode: opt('lightMode', false),
      dpr: options.dpr
    };
    var settingsRef = { current: settings };

    var canvas = document.createElement('canvas');
    canvas.className = 'grainient-canvas';
    canvas.setAttribute('aria-hidden', 'true');
    container.appendChild(canvas);
    var gl = canvas.getContext('webgl2', {
      alpha: false,
      antialias: false,
      depth: false,
      stencil: false
    });
    if (!gl) return;

    var field = link(gl, GRAINIENT_FIELD);
    var composite = link(gl, GRAINIENT_COMPOSITE);
    if (!field || !composite) return;
    var fu = field.uniforms;
    var cu = composite.uniforms;
    var vao = gl.createVertexArray();
    var target = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, target);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    var buffer = gl.createFramebuffer();
    var fieldSize = { width: 0, height: 0 };

    var probe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
    var colorCache = new Map();
    var parse = function (value) {
      var key = String(value);
      var cached = colorCache.get(key);
      if (cached) return cached;
      var rgb = [0, 0, 0];
      if (probe) {
        probe.clearRect(0, 0, 1, 1);
        probe.fillStyle = '#000000';
        probe.fillStyle = key;
        probe.fillRect(0, 0, 1, 1);
        var data = probe.getImageData(0, 0, 1, 1).data;
        rgb = [data[0] / 255, data[1] / 255, data[2] / 255];
      }
      colorCache.set(key, rgb);
      return rgb;
    };

    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var view = { width: 1, height: 1, ratio: 1 };
    var ramp = new Float32Array(MAX_COLORS * 3);
    var stirs = new Float32Array(MAX_STIRS * 4);
    var stirWeights = new Float32Array(MAX_STIRS);
    var twirls = new Float32Array(MAX_TWIRLS * 4);
    var trail = [];
    var spins = [];
    var pointer = { x: 0.5, y: 0.5, sx: 0.5, sy: 0.5, vx: 0, inside: false, fresh: true };
    var paletteKey = '';
    var time = 0;
    var introClock = settingsRef.current.intro && !reduce ? 0 : 1;
    var frameSeed = 0;
    var grainClock = 0;
    var raf = 0;
    var last = 0;
    var visible = true;

    var syncPalette = function () {
      var s = settingsRef.current;
      var key = s.colors.join(',') + '|' + s.lightMode;
      if (key === paletteKey) return;
      paletteKey = key;
      var labs = s.colors.map(function (color) { return toLab(parse(color)); });
      if (!s.lightMode) {
        labs.forEach(function (lab, i) { ramp.set(lab, i * 3); });
      } else {
        var blank = labs.map(function (lab) { return Math.abs(lab[0] - labs[0][0]) < 0.1; });
        var tints = labs.filter(function (_, i) { return !blank[i]; }).reverse();
        labs.forEach(function (_, i) {
          var pick = blank[i] ? [1, 0, 0] : tints.shift();
          ramp.set([pick[0] + (1 - pick[0]) * LIFT, pick[1] * (1 - LIFT), pick[2] * (1 - LIFT)], i * 3);
        });
      }
    };

    var draw = function () {
      var s = settingsRef.current;
      var aspect = view.width / view.height;
      syncPalette();
      gl.bindVertexArray(vao);
      gl.disable(gl.BLEND);
      gl.bindFramebuffer(gl.FRAMEBUFFER, buffer);
      gl.viewport(0, 0, fieldSize.width, fieldSize.height);
      gl.useProgram(field.program);
      gl.uniform1f(fu.uAspect, aspect);
      gl.uniform1f(fu.uTime, time);
      gl.uniform3fv(fu.uRamp, ramp);
      gl.uniform1i(fu.uCount, s.colors.length);
      var radians = (s.angle * Math.PI) / 180;
      gl.uniform1i(fu.uType, s.type);
      gl.uniform2f(fu.uDir, Math.sin(radians), Math.cos(radians));
      gl.uniform1f(fu.uExtent, aspect * Math.abs(Math.sin(radians)) + Math.abs(Math.cos(radians)));
      gl.uniform1f(fu.uBands, s.bands);
      gl.uniform1f(fu.uSoftness, s.softness);
      gl.uniform1f(fu.uFlow, s.flow);
      gl.uniform1f(fu.uScale, s.scale);
      gl.uniform1f(fu.uSilk, s.silk);
      gl.uniform4fv(fu.uStir, stirs);
      gl.uniform1fv(fu.uStirWeight, stirWeights);
      gl.uniform4fv(fu.uTwirl, twirls);
      gl.uniform2f(fu.uSeed, s.variation * 3.17, s.variation * 1.91);
      gl.uniform1f(fu.uContrast, s.contrast);
      gl.uniform1f(fu.uSaturation, s.saturation);
      gl.uniform1f(fu.uSettle, introClock * introClock * (3 - 2 * introClock));
      gl.uniform1f(fu.uReveal, introClock);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.useProgram(composite.program);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, target);
      gl.uniform1i(cu.uField, 0);
      gl.uniform1f(cu.uGrain, s.grainAmount);
      gl.uniform1f(cu.uGrainSize, s.grainSize * view.ratio);
      gl.uniform1f(cu.uFrame, frameSeed);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };

    var resize = function () {
      var s = settingsRef.current;
      view.width = Math.max(1, container.clientWidth);
      view.height = Math.max(1, container.clientHeight);
      view.ratio = Math.min(s.dpr || window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.round(view.width * view.ratio));
      canvas.height = Math.max(1, Math.round(view.height * view.ratio));
      var width = Math.max(1, Math.round(canvas.width / 2));
      var height = Math.max(1, Math.round(canvas.height / 2));
      if (width !== fieldSize.width || height !== fieldSize.height) {
        fieldSize.width = width;
        fieldSize.height = height;
        gl.bindTexture(gl.TEXTURE_2D, target);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        gl.bindFramebuffer(gl.FRAMEBUFFER, buffer);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, target, 0);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      }
      draw();
      wake();
    };

    var updateTouches = function (dt, aspect) {
      var s = settingsRef.current;
      var follow = 1 - Math.exp(-dt / 0.06);
      var px = pointer.sx;
      var py = pointer.sy;
      pointer.sx += (pointer.x - pointer.sx) * follow;
      pointer.sy += (pointer.y - pointer.sy) * follow;
      var vx = ((pointer.sx - px) / dt) * aspect;
      var vy = (pointer.sy - py) / dt;
      pointer.vx = vx;
      var head = trail[0];
      trail.forEach(function (sample) {
        if (sample.done) sample.age += dt;
      });
      if (s.interactive && pointer.inside && Math.hypot(vx, vy) > 0.02 && !reduce) {
        if (!head || head.done) {
          trail.unshift({ x: 0, y: 0, vx: 0, vy: 0, age: 0, grow: 0, done: false });
          if (trail.length > MAX_STIRS) trail.pop();
        }
        var live = trail[0];
        live.x = (pointer.sx - 0.5) * aspect;
        live.y = pointer.sy - 0.5;
        live.vx = vx;
        live.vy = vy;
        live.grow = Math.min(1, live.grow + dt / STIR_STEP);
        live.done = live.grow >= 1;
      } else if (head) {
        head.done = true;
      }
      while (trail.length && trail[trail.length - 1].age > STIR_LIFE) trail.pop();
      for (var i = 0; i < MAX_STIRS; i++) {
        var sample = trail[i];
        if (!sample) {
          stirWeights[i] = 0;
          continue;
        }
        var fade = 1 - sample.age / STIR_LIFE;
        var cap = Math.min(1, 2.2 / Math.max(Math.hypot(sample.vx, sample.vy), 0.001));
        stirs.set([sample.x, sample.y, sample.vx * cap, sample.vy * cap], i * 4);
        stirWeights[i] = fade * fade * sample.grow * s.stir * 0.05;
      }
      spins.forEach(function (spin) { spin.age += dt; });
      while (spins.length && spins[spins.length - 1].age > TWIRL_LIFE) spins.pop();
      for (var j = 0; j < MAX_TWIRLS; j++) {
        var spin = spins[j];
        if (!spin) {
          twirls[j * 4 + 2] = 0;
          continue;
        }
        var k = spin.age / TWIRL_LIFE;
        var envelope = Math.min(1, spin.age / 0.18) * (1 - k) * (1 - k);
        twirls.set([spin.x, spin.y, spin.direction * 2.4 * envelope, 0.16 + 0.1 * Math.min(1, spin.age / 0.5)], j * 4);
      }
    };

    var frame = function (now) {
      raf = 0;
      if (!visible || document.hidden) return;
      var s = settingsRef.current;
      var dt = last ? clamp((now - last) / 1000, 0.001, 0.05) : 1 / 60;
      last = now;
      if (!reduce) time += dt * s.speed * 0.16;
      if (introClock < 1) introClock = Math.min(1, introClock + dt / INTRO_SECONDS);
      grainClock += dt;
      if (s.grainAnimated && !reduce && grainClock > 1 / 24) {
        grainClock = 0;
        frameSeed = (frameSeed + 1) % 97;
      }
      updateTouches(dt, view.width / view.height);
      draw();
      var busy =
        (!reduce && (s.speed > 0 || s.grainAnimated)) || introClock < 1 || trail.length > 0 || spins.length > 0;
      if (busy) raf = requestAnimationFrame(frame);
      else last = 0;
    };

    var wake = function () {
      if (!raf && visible && !document.hidden) raf = requestAnimationFrame(frame);
    };

    var locate = function (event) {
      var rect = container.getBoundingClientRect();
      var x = (event.clientX - rect.left) / Math.max(1, rect.width);
      var y = 1 - (event.clientY - rect.top) / Math.max(1, rect.height);
      pointer.inside = x >= 0 && x <= 1 && y >= 0 && y <= 1;
      pointer.x = x;
      pointer.y = y;
      if (pointer.fresh || !pointer.inside) {
        pointer.sx = x;
        pointer.sy = y;
        pointer.fresh = false;
      }
    };

    var onPointerMove = function (event) {
      locate(event);
      if (pointer.inside || trail.length) wake();
    };

    var onPointerDown = function (event) {
      locate(event);
      var s = settingsRef.current;
      if (!pointer.inside || !s.clickSwirl || reduce) return;
      spins.unshift({
        x: (pointer.x - 0.5) * (view.width / view.height),
        y: pointer.y - 0.5,
        age: 0,
        direction: pointer.vx < 0 ? 1 : -1
      });
      if (spins.length > MAX_TWIRLS) spins.pop();
      wake();
    };

    var onPointerLeave = function () {
      pointer.inside = false;
    };

    var onVisibility = function () {
      last = 0;
      wake();
    };

    var resizeObserver = new ResizeObserver(resize);
    resizeObserver.observe(container);
    var intersection = new IntersectionObserver(function (entries) {
      visible = entries.some(function (entry) { return entry.isIntersecting; });
      if (visible) {
        last = 0;
        wake();
      }
    });
    intersection.observe(container);
    window.addEventListener('pointermove', onPointerMove, { passive: true });
    window.addEventListener('pointerdown', onPointerDown, { passive: true });
    document.documentElement.addEventListener('pointerleave', onPointerLeave);
    document.addEventListener('visibilitychange', onVisibility);
    resize();
  };

  grainient(document.getElementById("grain"), {
    colors: ['#0a0e16', '#2a2418', '#8a6420', '#c99b3f', '#efa63c', '#ffe9c4'],
    angle: 55,
    flow: 0.8,
    silk: 0.35,
    grainAmount: 0.08
  });
})();
</script>
</body>
</html>
